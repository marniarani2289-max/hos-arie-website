name: Next 16.3.4 Security Validation

on:
  push:
    branches:
      - security/next-16-3-4
    paths:
      - 'package.json'
      - '.github/workflows/next-16-3-4-security-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      E2E_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/next-16-3-4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package-lock.json with npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify locked Next.js version
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const version = lock.packages?.['node_modules/next']?.version;
          if (version !== '16.3.4') {
            throw new Error(`Expected Next 16.3.4 in lockfile, got ${version}`);
          }
          console.log(`LOCKED_NEXT_VERSION=${version}`);
          NODE

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Regenerate lockfile for Next 16.3.4"
            git push origin HEAD:security/next-16-3-4
          fi

      - name: Validate deterministic install
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --json > /tmp/audit-next.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('/tmp/audit-next.json', 'utf8'));
          console.log('AUDIT_METADATA=' + JSON.stringify(audit.metadata?.vulnerabilities || {}));
          const nextVuln = audit.vulnerabilities?.next;
          if (nextVuln) {
            console.error(JSON.stringify(nextVuln, null, 2));
            throw new Error('Next.js is still reported vulnerable after upgrading to 16.3.4');
          }
          console.log('NEXT_AUDIT_CLEAR');
          NODE

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start isolated local Supabase
        run: supabase start

      - name: Rebuild database from migrations and synthetic seed
        run: supabase db reset --local

      - name: Export local Supabase keys
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Start Next.js local E2E server
        run: |
          npm run dev -- --hostname localhost --port 3000 > /tmp/lexnusa-next.log 2>&1 &
          echo $! > /tmp/lexnusa-next.pid
          for i in {1..120}; do
            if curl --fail --silent http://localhost:3000/login >/dev/null; then
              echo "Next.js local E2E server is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/lexnusa-next.log
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run nine-gate CRM browser E2E
        run: node tests/lexnusa-crm-e2e.mjs

      - name: Show Next.js log on failure
        if: failure()
        run: cat /tmp/lexnusa-next.log || true

      - name: Stop Next.js
        if: always()
        run: |
          if [ -f /tmp/lexnusa-next.pid ]; then kill "$(cat /tmp/lexnusa-next.pid)" || true; fi

      - name: Destroy isolated Supabase environment
        if: always()
        run: supabase stop --no-backup || true
