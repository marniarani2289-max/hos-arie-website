name: LexNusa Playwright Lockfile Sync

on:
  push:
    branches:
      - feature/lexnusa-crm-v1-3
    paths:
      - 'package.json'

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/lexnusa-crm-v1-3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify deterministic install
        run: npm ci --ignore-scripts

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync lockfile for Playwright E2E dependency"
          git push origin HEAD:feature/lexnusa-crm-v1-3
