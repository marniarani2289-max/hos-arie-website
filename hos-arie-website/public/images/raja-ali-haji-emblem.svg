  <path d="M390 733c88-42 154-37 210 7 56-44 122-49 210-7v154c-88-34-154-26-210 24-56-50-122-58-210-24z" fill="none" stroke="#d6a736" stroke-width="12" stroke-linejoin="round"/>
  <path d="M600 740v171" stroke="#d6a736" stroke-width="7"/>
