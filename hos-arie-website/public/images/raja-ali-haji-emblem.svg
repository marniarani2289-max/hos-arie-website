<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Raja Ali Haji Institute emblem</title>
  <desc id="desc">A navy and antique-gold institutional seal featuring the Jawi name Raja Ali Haji.</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050919"/><stop offset="1" stop-color="#131a32"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5ca52"/><stop offset=".52" stop-color="#c58b22"/><stop offset="1" stop-color="#f0d27b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <circle cx="600" cy="600" r="535" fill="url(#navy)" stroke="#d6a736" stroke-width="10"/>
  <circle cx="600" cy="600" r="485" fill="none" stroke="#d6a736" stroke-opacity=".38" stroke-width="3"/>
